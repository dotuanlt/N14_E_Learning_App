server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cho phép tải tệp lớn (video bài giảng) qua /api
    client_max_body_size 500m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Chuyển tiếp API sang backend (cùng nguồn nên không bị lỗi CORS)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off;
    }

    # Tệp tĩnh có hash trong tên: cache lâu dài
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ứng dụng một trang: đường dẫn nào không phải tệp thì trả index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
